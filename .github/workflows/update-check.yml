name: update-check

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: herdr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run update.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./update.sh

      - name: Verify flake still evaluates and builds
        run: nix build .#default --print-build-logs

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(package): bump herdr to latest stable release"
          title: "chore(package): bump herdr to latest stable release"
          body: |
            Automated bump by the `update-check` workflow — new stable herdr
            release detected, hashes recomputed and verified with a fresh
            `nix build`.
          branch: bot/update-herdr
          delete-branch: true
